<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#1a2a44"/>
      <stop offset="75%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#3a5a86" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a5a86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2431"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- soft clouds -->
  <g filter="url(#soft)" opacity="0.5">
    <ellipse cx="300" cy="180" rx="260" ry="70" fill="#2a3c5a"/>
    <ellipse cx="1250" cy="140" rx="320" ry="90" fill="#233450"/>
    <ellipse cx="800" cy="90" rx="380" ry="60" fill="#1c2c48"/>
  </g>

  <!-- distant skyline -->
  <g fill="#0d1520" opacity="0.9">
    <rect x="80" y="620" width="90" height="260"/>
    <rect x="190" y="560" width="70" height="320"/>
    <rect x="1420" y="600" width="80" height="280"/>
    <rect x="1310" y="540" width="60" height="340"/>
  </g>

  <!-- building with lit windows (right side, echoes reference image) -->
  <g>
    <rect x="980" y="560" width="480" height="320" fill="#0e1622"/>
    <g fill="#f5c56a" opacity="0.85">
      <rect x="1010" y="600" width="26" height="26"/>
      <rect x="1060" y="600" width="26" height="26"/>
      <rect x="1010" y="650" width="26" height="26"/>
      <rect x="1110" y="640" width="26" height="26"/>
      <rect x="1160" y="600" width="26" height="26"/>
      <rect x="1210" y="660" width="26" height="26"/>
      <rect x="1260" y="610" width="26" height="26"/>
      <rect x="1310" y="650" width="26" height="26"/>
      <rect x="1360" y="600" width="26" height="26"/>
    </g>
  </g>

  <!-- crane silhouette -->
  <g stroke="#0a0f18" stroke-width="10" fill="none" stroke-linecap="round">
    <line x1="360" y1="900" x2="360" y2="380"/>
    <line x1="360" y1="380" x2="620" y2="380"/>
    <line x1="360" y1="380" x2="300" y2="430"/>
    <line x1="360" y1="420" x2="410" y2="380"/>
    <line x1="360" y1="900" x2="300" y2="900"/>
    <line x1="360" y1="900" x2="420" y2="900"/>
  </g>
  <line x1="600" y1="380" x2="600" y2="470" stroke="#0a0f18" stroke-width="6"/>

  <!-- foreground ground -->
  <rect x="0" y="860" width="1600" height="140" fill="url(#ground)"/>

  <!-- excavator-esque silhouette, center-left -->
  <g fill="#05070a">
    <rect x="520" y="800" width="220" height="70" rx="10"/>
    <rect x="560" y="740" width="90" height="70" rx="8"/>
    <path d="M640 760 L760 700 L790 715 L700 790 L650 800 Z"/>
    <circle cx="560" cy="880" r="42"/>
    <circle cx="700" cy="880" r="42"/>
  </g>
</svg>
