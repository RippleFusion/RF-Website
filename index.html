<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRUCTA — Build With Precision</title>
  <meta name="description" content="Hero landing page template for a construction / building company." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="hero">
    <!-- Background layers -->
    <div class="hero-bg" aria-hidden="true">
      <img src="assets/img/hero-bg.svg" alt="" class="hero-bg-img" />
      <div class="hero-overlay"></div>
    </div>

    <!-- Nav -->
    <nav class="navbar">
      <a href="#" class="logo">
        <span class="logo-mark">&#9670;</span>
        STRUCTA
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="#home" class="active">Home</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#about">About</a></li>
      </ul>

      <div class="nav-actions">
        <a href="#contact" class="btn btn-outline">Start a project</a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- Hero content -->
    <div class="hero-content">
      <h1 class="hero-title">BUILD</h1>
    </div>

    <!-- Bottom row: CTA card + since badge -->
    <div class="hero-bottom">
      <div class="cta-card">
        <p>Hire us for your<br />next project.</p>
        <a href="#contact" class="btn btn-primary">
          Book now
          <span class="btn-icon">&#8599;</span>
        </a>
      </div>

      <div class="since-badge">
        <span class="since-mark">///</span>
        <span>OPERATING SINCE<br /><strong>2010</strong></span>
      </div>
    </div>

    <div class="scroll-cue" aria-hidden="true">
      <span></span>
    </div>
  </header>

  <script src="assets/js/main.js"></script>
</body>
</html>
